        <h1>Request Quote</h1>
          <div class="container">
            <P>Please complete this form to get a free quote for a service.</P>
    
          <form action="malito:cse25-368@thuto.bac.ac.bw/submit" method="post" enctype="text/plain"></form>
            <div class="row">
              <div class="col">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required>
              </div>
              <div class="col">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required>
              </div>
            </div>

            <div class="row">
              <div class="col">
                <label for="number">Phone Number</label>
                <input type="tel" id="number" name="number" required>
              </div>
              <div class="col">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
              </div>
            </div>

            
            <div class="row">
              <div class="col">
                 <label for="loc-to">Location</label>
                <input type="text" id="loc-to" name="loc-to" required placeholder="Where is delievry to?">
              </div>
               <div class="col">
                <label for="subject">Service</label>
                <select id="subject" name="subject" required>
                  <option value="" disabled selected>Select a service...</option>
                  <option value="relocations">Relocations</option>
                  <option value="packaging">Packaging</option>
                  <option value="distribution">Distribution</option>
                  <option value="shipping">Shipping</option>
                </select>
              </div>        
              </div>

            <label for="message">Additional Info</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Submit</button>
          </form>
